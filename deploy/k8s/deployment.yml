apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesnest-web
  labels:
    app: salesnest-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salesnest-web
  template:
    metadata:
      labels:
        app: salesnest-web
    spec:
      containers:
        - name: web
          image: salesnest:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: salesnest-secrets
                  key: CLAUDE_API_KEY
